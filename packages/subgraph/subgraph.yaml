specVersion: 1.3.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum/contract
    name: FeeStrip
    network: sepolia
    context:
      chainId:
        type: BigInt
        data: '11155111'
    source:
      address: '0x0000000000000000000000000000000000000000'
      abi: FeeStrip
      startBlock: 11682000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Series
        - LifecycleEvent
      abis:
        - name: FeeStrip
          file: ./abis/FeeStrip.json
      eventHandlers:
        - event: Activated(indexed uint256,indexed uint256,indexed uint256,address,uint64,uint256)
          handler: handleActivated
        - event: Captured(indexed uint256,uint256,uint256)
          handler: handleCaptured
        - event: Allocated(indexed uint256,uint256,uint256)
          handler: handleAllocated
        - event: NFTReturned(indexed uint256,indexed address)
          handler: handleNFTReturned
        - event: Redeemed(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleRedeemed
        - event: ResidualTransferred(indexed uint256,indexed address,indexed address)
          handler: handleResidualTransferred
        - event: Recombined(indexed uint256,indexed address)
          handler: handleRecombined
      file: ./src/mapping.ts
