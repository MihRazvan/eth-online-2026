[package]
name = "feestrip-context"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
substreams = "=0.7.6"
substreams-ethereum-core = "=0.11.1"
prost = "=0.13.5"
prost-types = "=0.13.5"
hex = "=0.4.3"
[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.2.0"
[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
