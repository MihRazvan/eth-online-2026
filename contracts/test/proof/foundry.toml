[profile.default]
src = "../../src/proof"
test = "."
libs = ["../../lib"]
remappings = ["src/=../../src/", "lib/=../../lib/"]
out = "../../out-proof"
cache_path = "../../cache-proof"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../../../scripts/proof" }]
allow_paths = ["../../src", "../../../scripts/proof"]
